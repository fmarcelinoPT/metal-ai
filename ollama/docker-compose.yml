volumes:
  ollama_data:
    name: ollama_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/ollama_data
  ollama_models:
    name: ollama_models
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/ollama_models

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    runtime: nvidia
    ports:
      - 11434:11434
    environment:
      - OLLAMA_NUM_PARALLEL=4       # Processar 4 pedidos em paralelo
      - OLLAMA_MAX_LOADED_MODELS=2  # Manter 2 modelos em memória
      - OLLAMA_FLASH_ATTENTION=1    # Ativar Flash Attention (mais rápido)
      - CUDA_VISIBLE_DEVICES=0,1    # Usar ambas GPUs
      - OLLAMA_KEEP_ALIVE=12h       # Aumentar timeout de keep-alive
    volumes:
      - ollama_data:/root/.ollama
      - ollama_models:/opt/models
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]